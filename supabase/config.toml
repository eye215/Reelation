project_id = "gnzcatibyrqbxxdnsdua"

[api]
enabled = true

[db]
major_version = 17

[auth]
enabled = true

# Public invite lookup validates opaque tokens inside the function. It must be
# callable before a visitor signs in.
[functions.resolve-invite]
verify_jwt = false

# Both endpoints validate the authenticated user with auth.getUser() before
# writing any participant data. Disabling gateway verification also supports
# current Supabase publishable keys while preserving server-side auth checks.
[functions.submit-invite-auth]
verify_jwt = false

[functions.create-invite]
verify_jwt = false
